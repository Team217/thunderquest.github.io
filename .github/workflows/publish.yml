name: Publish scores

on:
  push:
    branches: [main]
    paths: ["data/**", "site/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write   # lets the build save data/scores.csv back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/build_site.py
      - name: Save scores.csv back to the repo
        continue-on-error: true   # never block the site if this step has a problem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scores.csv
          git diff --cached --quiet || (git commit -m "Update scores.csv [skip ci]" && git push origin HEAD)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
